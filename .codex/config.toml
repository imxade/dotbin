# ============================================================
# Core model settings
# ============================================================

model = "gpt-5.6-luna"
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "minimal"
model_reasoning_summary = "none"
model_verbosity = "low"

service_tier = "default"
personality = "pragmatic"

# ============================================================
# Local execution / approvals
# ============================================================

# Codex itself never pauses for routine shell approval.
approval_policy = "never"

# Keep writes restricted to the active workspace.
sandbox_mode = "workspace-write"

# AGY is launched as a child process and needs outbound model/auth access.
[sandbox_workspace_write]
network_access = true

# ============================================================
# Agents / features
# ============================================================

[agents]
enabled = false

[features]
multi_agent = false
apps = false
remote_plugin = false
memories = false
skill_mcp_dependency_install = false

# Keep normal local execution efficient.
shell_snapshot = true
shell_tool = true
unified_exec = true

[projects."/home/x"]
trust_level = "trusted"

[projects."/home/x/Downloads/project/galaxy"]
trust_level = "trusted"

[projects."/home/x/Downloads/project/course-platform"]
trust_level = "trusted"

[projects."/home/x/Downloads/project/profily"]
trust_level = "trusted"

[projects."/home/x/Downloads/project/reward-router"]
trust_level = "trusted"

[projects."/tmp/inject"]
trust_level = "trusted"

[tui.model_availability_nux]
gpt-6-astra = 2

[[skills.config]]
path = "/home/x/.agents/skills/graphify/SKILL.md"
enabled = false
