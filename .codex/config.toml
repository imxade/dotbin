# ============================================================
# Core model settings
# ============================================================

model = "gpt-6-astra"
model_reasoning_effort = "low"
model_reasoning_summary = "none"
model_verbosity = "low"

service_tier = "default"

# Pragmatic is already fairly concise.
# Change to "none" if you want absolutely minimal style instructions.
personality = "pragmatic"


# ============================================================
# Local execution
# ============================================================

# Never interrupt for command approval.
approval_policy = "never"

# Allow Codex to modify files only inside the workspace.
sandbox_mode = "workspace-write"


# ============================================================
# Web search
# ============================================================

# Prevent Codex from doing web searches unless you change this.
# This avoids search calls and the additional retrieved context.
web_search = "disabled"


# ============================================================
# Multi-agent / subagent orchestration
# ============================================================

[agents]
enabled = false

[features]
# No legacy multi-agent orchestration.
multi_agent = false
multi_agent_mode = false

# Disable external apps / connectors / plugins.
apps = false
connectors = false
plugins = false
remote_plugin = false
recommended_plugins = false

# Disable persistent/model memory features.
memories = false
memory_tool = false

# Do not search for additional skills automatically.
skill_search = false

# Prevent skills from installing MCP dependencies.
skill_mcp_dependency_install = false

# Disable capabilities that are unnecessary for normal
# VS Code coding and can expose additional tool surfaces.
browser_use = false
browser_use_external = false
computer_use = false
image_generation = false
imagegenext = false
search_tool = false

# KEEP THESE ENABLED.
# They are useful for normal local coding and can actually
# make repeated terminal operations more efficient.
shell_snapshot = true
shell_tool = true


# Multi-agent V2 has its own nested configuration and takes
# precedence over [agents] when enabled.
[features.multi_agent_v2]
enabled = false


# ============================================================
# Apps / connectors
# ============================================================

# Disable every app/connector by default.
[apps._default]
enabled = false



